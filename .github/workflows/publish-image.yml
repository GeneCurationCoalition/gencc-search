name: Build and Push Image (GHCR)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g., 0.1.0). Leave empty to use release tag or branch name."
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            IMAGE_TAG="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME#v}"  # Strip 'v' prefix: v1.2.3 -> 1.2.3
          else
            IMAGE_TAG="${GITHUB_REF_NAME}"  # Use branch name
          fi

          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "::notice::IMAGE=${IMAGE}"
          echo "::notice::IMAGE_TAG=${IMAGE_TAG}"
          echo "::notice::SHA_TAG=${SHA_TAG}"

      - name: Build and push (Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.image_tag }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.sha_tag }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.version.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.version.outputs.image }}:buildcache,mode=max

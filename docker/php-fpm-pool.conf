; PHP-FPM Pool Configuration for GenCC Search
; Optimized for ~100 concurrent users
;
; Memory calculation:
; - Normal requests: ~50-150MB per worker
; - CSV/TSV exports: ~300-400MB per worker
; - XLSX exports: up to 512MB per worker (memory_limit)
;
; Container memory recommendation:
; - Minimum: 4GB (25 max_children)
; - Recommended: 8GB (50 max_children)
; - High traffic: 16GB (100 max_children)

[www]
; Run as unprivileged user
user = www
group = www

; Listen on localhost (nginx connects via fastcgi_pass)
listen = 127.0.0.1:9000

; Dynamic process management - scales workers based on load
pm = dynamic

; Maximum number of child processes (concurrent PHP requests)
; For 100 concurrent users, ~30-50% will be active PHP at any moment
pm.max_children = 50

; Number of child processes created on startup
pm.start_servers = 10

; Minimum number of idle server processes
pm.min_spare_servers = 5

; Maximum number of idle server processes
pm.max_spare_servers = 20

; Number of requests each child process should execute before respawning
; Prevents memory leaks from accumulating
pm.max_requests = 500

; Timeout for serving a single request (matches php.ini max_execution_time)
request_terminate_timeout = 300

; Slow log threshold (log requests taking longer than this)
slowlog = /dev/stderr
request_slowlog_timeout = 30

; Status page for monitoring (optional - enable if needed)
; pm.status_path = /fpm-status
; ping.path = /fpm-ping

; Environment variables passed to workers
clear_env = no

; Catch worker output (for error logging)
catch_workers_output = yes
decorate_workers_output = no
